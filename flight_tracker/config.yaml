# Flight price tracker – MEL -> ELS return, Dec 2026 / Jan 2027
# Secrets (API keys, SMTP) live in .env, never here.

trip:
  origin: MEL
  destination: ELS
  outbound: 2026-12-21
  return: 2027-01-08
  adults: 1
  cabin: economy
  currency: AUD
  flex:
    outbound: [2026-12-19, 2026-12-20, 2026-12-22]
    return: [2027-01-07, 2027-01-09, 2027-01-10]
  # cross = primary pair + each flex outbound with primary return
  #         + primary outbound with each flex return  (7 searches/provider)
  # grid  = every outbound x every return            (16 searches/provider)
  flex_mode: cross
  # Flex dates are searched once a day, on the first run at or after this local hour
  # (the 17:00 cron). The other runs check the primary dates only, which keeps cost down.
  # Set to 0 to search flex dates on every run.
  flex_from_hour: 15

scoring:
  dollars_per_hour: 50          # penalty per hour over the threshold, per direction
  hours_threshold: 22           # hours per direction before the penalty starts
  too_long_hours: 30            # any direction longer than this is flagged "too long"...
  too_long_exempt_saving: 500   # ...unless its price beats the best non-flagged option by more than this

decision:
  buy_below_baseline_pct: 5     # BUY if best value_score is this % or more below baseline
  buy_under_price: 3000         # BUY if best single-ticket price is under this (AUD)
  rising_runs_for_buy: 2        # BUY if best has risen this many runs in a row
  hold_movement_pct: 3          # HOLD if day-on-day movement is under this %
  book_by: 2026-10-14           # on/after this date: recommend booking the best option
  hard_stop: 2026-10-31         # no searches after this date
  # The tracker runs 3x a day. "day" = compare each day's latest run (spec semantics:
  # "vs yesterday", "risen 2 days in a row"). "run" = compare every run.
  trend_basis: day

jev:
  enabled: true                 # silently skipped if JEV_API_KEY is not set
  model: jev-latest             # overridden by JEV_MODEL in the environment
  # JEV can upgrade a HOLD to BUY when P(book today) >= this. It never downgrades a BUY.
  # Set to null to make JEV advisory only.
  upgrade_hold_threshold: 0.80
  min_days_before_upgrade: 3

providers:
  # Ignav – primary source.
  ignav:
    enabled: true
    base_url: https://ignav.com/api
    endpoint: /fares/round-trip
    timeout_s: 60
    concurrency: 4              # date pairs searched in parallel
    # extra_body: {max_stops: 3}  # merged into every request body
  # Google Flights via SerpApi – second source; skipped if SERPAPI_KEY is not set.
  serpapi:
    enabled: true
    base_url: https://serpapi.com/search.json
    timeout_s: 60
    concurrency: 4
    # Google returns outbound options first; each return leg needs one more call.
    return_legs_primary: 3      # cheapest N outbound options expanded on 21 Dec / 8 Jan
    return_legs_flex: 1         # ...and on each flex date pair
    primary_dates_only: false   # true = Google only checks 21 Dec / 8 Jan (cheaper)

http:
  retries: 3                    # attempts after the first one
  backoff_base_s: 2             # 2s, 4s, 8s ...
  retry_on_status: [429, 500, 502, 503, 504]

# Storage: when BLOB_READ_WRITE_TOKEN is set (Vercel, after connecting a Blob store) every
# run, raw response and log line is stored as JSON in Vercel Blob. Otherwise (local CLI)
# SQLite + files under data/ and logs/.
storage:
  blob:
    base_url: https://vercel.com/api/blob
    api_version: "11"
    access: private             # must match the store's access mode
    cache_max_age: 60           # seconds; index.json is overwritten each run

paths:
  db: data/tracker.sqlite3
  raw_dir: data/raw
  daily_log: logs/daily_log.md
  app_log: logs/tracker.log

timezone: Australia/Melbourne
