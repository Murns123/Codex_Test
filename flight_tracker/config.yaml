# Flight price tracker – MEL -> ELS return, Dec 2026 / Jan 2027
# Secrets (API keys, SMTP) live in .env, never here.

trip:
  origin: MEL
  destination: ELS
  outbound: 2026-12-21
  return: 2027-01-08
  adults: 1
  cabin: economy
  currency: AUD
  flex:
    # +/- 2 days either side of 21 Dec / 8 Jan
    outbound: [2026-12-19, 2026-12-20, 2026-12-22, 2026-12-23]
    return: [2027-01-06, 2027-01-07, 2027-01-09, 2027-01-10]
  # cross = primary pair + each flex outbound with primary return
  #         + primary outbound with each flex return  (9 searches/provider)
  # grid  = every outbound x every return            (25 searches/provider)
  flex_mode: grid
  # Flex dates are searched once a day, on the first run at or after this local hour
  # (the 17:00 cron). The other runs check the primary dates only, which keeps cost down.
  # Set to 0 to search flex dates on every run.
  flex_from_hour: 15
  # Seconds into a run after which remaining sections search the primary dates only
  # (Vercel kills a function at 300s). Run timings are saved in each report under "timings".
  flex_time_budget_s: 170

scoring:
  dollars_per_hour: 50          # penalty per hour over the threshold, per direction
  hours_threshold: 22           # hours per direction before the penalty starts
  too_long_hours: 30            # any direction longer than this is flagged "too long"...
  too_long_exempt_saving: 500   # ...unless its price beats the best non-flagged option by more than this

decision:
  buy_below_baseline_pct: 5     # BUY if best value_score is this % or more below baseline
  buy_under_price: 3000         # BUY if best single-ticket price is under this (AUD)
  rising_runs_for_buy: 2        # BUY if best has risen this many runs in a row
  hold_movement_pct: 3          # HOLD if day-on-day movement is under this %
  book_by: 2026-10-14           # on/after this date: recommend booking the best option
  hard_stop: 2026-10-31         # no searches after this date
  # The tracker runs 3x a day. "day" = compare each day's latest run (spec semantics:
  # "vs yesterday", "risen 2 days in a row"). "run" = compare every run.
  trend_basis: day

jev:
  enabled: true                 # silently skipped if JEV_API_KEY is not set
  model: jev-latest             # overridden by JEV_MODEL in the environment
  # JEV can upgrade a HOLD to BUY when P(book today) >= this. It never downgrades a BUY.
  # Set to null to make JEV advisory only.
  upgrade_hold_threshold: 0.80
  min_days_before_upgrade: 3

# Generic route sections – same engine as the Qantas section, any airline. The domestic
# JNB -> ELS connection is deliberately left out. Return fares only by default (1 Ignav call
# on normal runs, 7 on the flex run); set one_way: true to also track one-ways.
routes:
  mel_jnb:
    enabled: true
    title: "MEL ⇄ JNB (any airline)"
    prefix: mj                  # series names: mj_rt, mj_out, mj_back
    origin: MEL
    destination: JNB
    carrier: null               # null = any airline
    one_way: false
    concurrency: 6
    step_jump_pct: 8
    decision:
      buy_below_baseline_pct: 5
      rising_runs_for_buy: 2
      hold_movement_pct: 3
      buy_under_price: null
    jev:
      upgrade_hold_threshold: 0.80
      min_days_before_upgrade: 3

# Qantas SYD <-> JNB section: return + one-way each direction, Qantas only, same dates as
# the trip (flex dates on the daily flex run). Uses Ignav: 3 calls on normal runs, up to 15
# on the flex run (~21/day). Own rules + its own JEV question set.
qantas:
  enabled: true
  origin: SYD
  destination: JNB
  carrier: QF
  one_way: true                 # also track SYD->JNB and JNB->SYD one-ways
  airline_filter_in_request: true   # send airlines_include: [QF]; results are filtered locally too
  one_way_endpoint: /fares/one-way
  concurrency: 6
  step_jump_pct: 8              # day-on-day move counted as a fare "step" (bucket change)
  decision:                     # applied to the return fare
    buy_below_baseline_pct: 5
    rising_runs_for_buy: 2
    hold_movement_pct: 3
    buy_under_price: null       # AUD; set a target once you know the market (null = rule off)
  jev:
    upgrade_hold_threshold: 0.80
    min_days_before_upgrade: 3

providers:
  # Ignav – primary source.
  ignav:
    enabled: true
    base_url: https://ignav.com/api
    endpoint: /fares/round-trip
    timeout_s: 60
    concurrency: 6              # date pairs searched in parallel
    send_currency: false        # Ignav rejects "currency"; USD quotes are converted at the ECB rate
    fx_url: https://api.frankfurter.app/latest
    # extra_body: {max_stops: 3}  # merged into every request body
  # Google Flights via SerpApi – second source; skipped if SERPAPI_KEY is not set.
  serpapi:
    enabled: true
    base_url: https://serpapi.com/search.json
    timeout_s: 60
    concurrency: 6
    # Google returns outbound options first; each return leg needs one more call.
    # Sized for the SerpApi Free plan (250 searches/month): primary dates only, 1 return-leg
    # expansion = 2 searches per run, 6 per day, ~186 to 31 Oct. Ignav covers the flex dates.
    return_legs_primary: 1      # cheapest N outbound options expanded on 21 Dec / 8 Jan
    return_legs_flex: 1         # ...and on each flex date pair (if primary_dates_only is false)
    primary_dates_only: true
    reserve_searches: 10        # skip Google rather than go below this many searches left

http:
  retries: 3                    # attempts after the first one
  backoff_base_s: 2             # 2s, 4s, 8s ...
  retry_on_status: [429, 500, 502, 503, 504]

# Storage: when BLOB_READ_WRITE_TOKEN is set (Vercel, after connecting a Blob store) every
# run, raw response and log line is stored as JSON in Vercel Blob. Otherwise (local CLI)
# SQLite + files under data/ and logs/.
storage:
  blob:
    base_url: https://vercel.com/api/blob
    api_version: "11"
    access: private             # must match the store's access mode
    cache_max_age: 60           # seconds; index.json is overwritten each run
    # Stores connected with OIDC have BLOB_STORE_ID instead of a read-write token; the
    # per-request OIDC token is then sent with the store id in this header.
    store_id_header: x-vercel-blob-store-id

paths:
  db: data/tracker.sqlite3
  raw_dir: data/raw
  daily_log: logs/daily_log.md
  app_log: logs/tracker.log

timezone: Australia/Melbourne
